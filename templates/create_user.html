{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-person-plus"></i> Create New User</h5>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('create_user') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="e.g. user@domain.com" required>
                        <div class="form-text">The user login identifier (typically the primary email address).</div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="address" name="address"
                               placeholder="e.g. user@example.com">
                        <div class="form-text">Primary email address for this user.</div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Display Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               placeholder="e.g. John Doe">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter a strong password" required minlength="8">
                        <div class="form-text">Minimum 8 characters.</div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="quota" class="form-label">Storage Quota (GB)</label>
                            <input type="number" class="form-control" id="quota" name="quota"
                                   value="1" step="0.5" min="0">
                            <div class="form-text">0 = unlimited. Default: 1 GB</div>
                        </div>
                        <div class="col-md-6">
                            <label for="spam_level" class="form-label">Spam Level (0–100)</label>
                            <input type="number" class="form-control" id="spam_level" name="spam_level"
                                   value="50" step="1" min="0" max="100">
                            <div class="form-text">0 = most aggressive, 100 = no filtering.</div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="recipients" class="form-label">Max Recipients / Day</label>
                            <input type="number" class="form-control" id="recipients" name="recipients"
                                   value="2000" step="1" min="0">
                        </div>
                        <div class="col-md-6">
                            <label for="forwards" class="form-label">Max Forwards / Day</label>
                            <input type="number" class="form-control" id="forwards" name="forwards"
                                   value="2000" step="1" min="0">
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Create User
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
