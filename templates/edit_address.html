{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Address</h5>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('edit_address', address=address.get('address', '')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" value="{{ address.get('address', '') }}" disabled>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Display Name</label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ address.get('name', '') }}">
                    </div>

                    <div class="mb-4">
                        <label for="targets" class="form-label">Forward To</label>
                        <textarea class="form-control" id="targets" name="targets" rows="4"
                                  placeholder="One target per line">{{ address.get('targets', []) | join('\n') }}</textarea>
                        <div class="form-text">One target per line. Clearing the box removes all targets.</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Save Changes
                        </button>
                        <a href="{{ url_for('index', tab='addresses') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
